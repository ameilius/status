# Change these first
owner: ameilius # Your GitHub organization or username, where this repository lives
repo: status # The name of this repository
user-agent: ameilius

secrets:
  - CONTROL_PLANE_URL

sites:
  - name: TheHippo
    url: https://thehippo.co
  - name: Cigar Nexus
    url: https://cigarnexus.app
  - name: Rupture Report
    url: https://rupturereport.com
  - name: Mr JW Bentley
    url: https://mrjwbentley.com
  - name: Bentley Mail
    url: https://bentleymail.site
  - name: Ameilius
    url: https://ameilius.com
  - name: Baincrest
    url: https://baincrest.com
  - name: Explore Sylva
    url: https://exploresylva.com
  - name: Pawsitive Care
    url: https://pawsitivecarepetservs.com
  - name: Control Plane
    slug: control-plane
    url: $CONTROL_PLANE_URL
    icon: https://raw.githubusercontent.com/ameilius/status/master/assets/hippoco-logo.png

assignees:
  - ameilius

status-website:
  # Custom domain; omit baseUrl so history links are /history/<slug>, not //history/<slug>
  cname: status.thehippo.co
  name: TheHippo Status
  logoUrl: https://status.thehippo.co/hippoco-logo.png
  favicon: https://status.thehippo.co/hippoco-logo.png
  introTitle: "**TheHippo Status**"
  introMessage: Live status for TheHippo sites. Checks run every 5 minutes from GitHub Actions, independently of the VPS.
  navbar:
    - title: Status
      href: /
    - title: TheHippo
      href: https://thehippo.co
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  links:
    - rel: stylesheet
      href: https://status.thehippo.co/thehippo-theme.css
  scripts:
    - src: https://status.thehippo.co/theme-toggle.js
  customHeadHtml: |
    <meta name="theme-color" content="#03040b">
    <script>
    (function(){try{var t=localStorage.getItem("thehippo-theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();
    </script>
  metaTags:
    - name: color-scheme
      content: "dark light"
    - name: theme-color
      content: "#03040b"
